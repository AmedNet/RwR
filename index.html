<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>小兵步枪 · 模块化</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
            font-family: sans-serif;
        }
        #gameContainer {
            background: #16213e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
            background: #2d4a22;
            border-radius: 8px;
            cursor: crosshair;
        }
        #ui {
            display: flex;
            justify-content: space-between;
            color: #eee;
            padding: 10px 5px 0 5px;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }
        #ui span {
            background: rgba(0,0,0,0.5);
            padding: 4px 16px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
<div id="gameContainer">
    <div id="ui">
        <span>🎖️ 军衔: <span id="rankDisplay">列兵</span></span>
        <span>💀 击杀: <span id="killDisplay">0</span></span>
        <span>❤️ <span id="healthDisplay">100</span></span>
    </div>
    <canvas id="gameCanvas" width="900" height="600"></canvas>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
