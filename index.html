<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RwR</title>
    <style>
        /* 全局重置 & 全屏 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
        }

        /* 画布容器：填满整个视口 */
        #gameContainer {
            width: 100%;
            height: 100%;
            position: relative;
            background: #2d4a22;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #2d4a22;
            cursor: crosshair;
        }

        /* ===== 毛玻璃 HUD ===== */
        #hud {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            padding: 12px 32px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            user-select: none;
            z-index: 10;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        #hud .hud-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #hud .hud-item .icon {
            font-size: 22px;
            line-height: 1;
        }

        #hud .hud-item .value {
            min-width: 40px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        #killDisplay {
            color: #ffd93d;
        }
        #rpDisplay {
            color: #FFD700;
        }
        #inventoryHint {
            color: #4CAF50;
        }

        @media (max-width: 600px) {
            #hud {
                font-size: 14px;
                padding: 8px 16px;
                gap: 16px;
                top: 12px;
            }
            #hud .hud-item .icon {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <!-- 毛玻璃 HUD -->
        <div id="hud">
            <div class="hud-item">
                <span>K</span>
                <span class="value" id="killDisplay">0</span>
            </div>
            <div class="hud-item">
                <span>RP</span>
                <span class="value" id="rpDisplay">0</span>
            </div>
            <div class="hud-item">
                <span>item</span>
                <span class="value" id="inventoryHint">Q</span>
            </div>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
